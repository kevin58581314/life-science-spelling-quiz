<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Science Spelling Quiz</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}main{max-width:720px;border:1px solid rgba(148,163,184,.25);border-radius:24px;background:#111827;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.42)}h1{margin:0 0 12px;font-size:clamp(1.8rem,5vw,3rem)}p{color:#cbd5e1;line-height:1.6}.err{color:#fecaca;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);border-radius:16px;padding:16px;white-space:pre-wrap}</style>
</head>
<body>
<main id="loader"><h1>Loading quiz...</h1><p>Please wait a moment.</p></main>
<script>
const STABLE_SOURCE='https://raw.githubusercontent.com/kevin58581314/life-science-spelling-quiz/a84ff34c26a6503e6ebddd03792440a099b7c57d/index.html';
const EXTRA_CSS=`
.week-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:24px}
.week-btn{width:100%;min-height:86px;text-align:left;background:rgba(37,99,235,.92);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px}
.week-btn small{display:block;color:#dbeafe;font-size:.82rem;font-weight:700;line-height:1.25}
.reading-status{margin-top:12px;color:#bfdbfe;font-weight:800}
.wrong-row{background:rgba(239,68,68,.12)}
.wrong-row td{border-bottom-color:rgba(239,68,68,.22)}
.wrong-answer{color:#fecaca;text-decoration:none!important;font-weight:900}
.summary-meta{margin:12px 0 0;color:#cbd5e1;font-size:1rem}
.print-note{color:#94a3b8;font-size:.96rem;margin:0 0 18px}
.summary-controls{margin:0 0 16px}
.filter-btn{background:#334155}
.filter-btn.active{background:#2563eb;box-shadow:0 0 0 4px rgba(96,165,250,.18)}
.empty-state{border:1px solid rgba(34,197,94,.35);background:rgba(34,197,94,.1);color:#bbf7d0;border-radius:16px;padding:16px;margin:0 0 18px;font-weight:900}
.settings-card{margin-top:26px;border:1px solid rgba(148,163,184,.25);border-radius:20px;background:rgba(15,23,42,.45);padding:16px}
.settings-card summary{cursor:pointer;font-weight:950;color:#bfdbfe;font-size:1.05rem}
.settings-panel{display:grid;gap:14px;margin-top:16px}
.settings-panel select{font-size:1rem}
.range-row{display:grid;gap:8px}
.range-row input[type=range]{width:100%;accent-color:#60a5fa}
.rate-value{color:#bfdbfe;font-weight:900}
.tiny-note{margin:0;color:#94a3b8;font-size:.92rem;line-height:1.45}
@media print{body{background:white!important;color:#111827!important;padding:0}.app{box-shadow:none!important;border:0!important;background:white!important;color:#111827!important}.top{background:white!important;color:#111827!important}.content{padding:18px!important}.screen{display:none!important}#summaryScreen{display:block!important}.button-row.no-print,.settings-card.no-print{display:none!important}table{background:white!important;color:#111827!important}th{background:#e5e7eb!important;color:#111827!important}td{color:#111827!important}.score,.table-wrap{border-color:#cbd5e1!important;background:white!important}.score-note,.subtitle,.summary-meta,.print-note{color:#334155!important}.badge{border:1px solid #93c5fd!important;color:#1e3a8a!important;background:#eff6ff!important}.wrong-row{background:#fee2e2!important}.wrong-answer{color:#991b1b!important}.empty-state{border-color:#86efac!important;background:#dcfce7!important;color:#166534!important}}
`;
fetch(STABLE_SOURCE)
  .then(response=>{
    if(!response.ok) throw new Error('Unable to load quiz source: '+response.status);
    return response.text();
  })
  .then(html=>{
    html=html.replace('</style>',EXTRA_CSS+'</style>');
    html=html.replace('</body>','<script src="patch.js?v=1"></scr'+'ipt></body>');
    document.open();
    document.write(html);
    document.close();
  })
  .catch(error=>{
    document.getElementById('loader').innerHTML='<h1>Unable to load quiz</h1><div class="err">'+String(error.message||error)+'</div><p>Please reload the page or open it in Chrome / Safari.</p>';
  });
</script>
</body>
</html>
