<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Science Spelling Quiz</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}main{max-width:720px;border:1px solid rgba(148,163,184,.25);border-radius:24px;background:#111827;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.42)}h1{margin:0 0 12px;font-size:clamp(1.8rem,5vw,3rem)}p{color:#cbd5e1;line-height:1.6}.err{color:#fecaca;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);border-radius:16px;padding:16px;white-space:pre-wrap}</style>
</head>
<body>
<main id="loader"><h1>Loading quiz...</h1><p>Please wait a moment.</p></main>
<script>
const STABLE_SOURCE='https://raw.githubusercontent.com/kevin58581314/life-science-spelling-quiz/a84ff34c26a6503e6ebddd03792440a099b7c57d/index.html';
fetch(STABLE_SOURCE)
  .then(response=>{
    if(!response.ok) throw new Error('Unable to load quiz source: '+response.status);
    return response.text();
  })
  .then(html=>{
    html=html.replace('</style>',`\n.week-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:24px}.week-btn{width:100%;min-height:86px;text-align:left;background:rgba(37,99,235,.92);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px}.week-btn small{display:block;color:#dbeafe;font-size:.82rem;font-weight:700;line-height:1.25}.reading-status{margin-top:12px;color:#bfdbfe;font-weight:800}.wrong-row{background:rgba(239,68,68,.12)}.wrong-row td{border-bottom-color:rgba(239,68,68,.22)}.wrong-answer{color:#fecaca;text-decoration:none!important;font-weight:900}.summary-meta{margin:12px 0 0;color:#cbd5e1;font-size:1rem}.print-note{color:#94a3b8;font-size:.96rem;margin:0 0 18px}@media print{body{background:white!important;color:#111827!important;padding:0}.app{box-shadow:none!important;border:0!important;background:white!important;color:#111827!important}.top{background:white!important;color:#111827!important}.content{padding:18px!important}.screen{display:none!important}#summaryScreen{display:block!important}.button-row,.no-print{display:none!important}table{background:white!important;color:#111827!important}th{background:#e5e7eb!important;color:#111827!important}td{color:#111827!important}.score,.table-wrap{border-color:#cbd5e1!important;background:white!important}.score-note,.subtitle,.summary-meta{color:#334155!important}.badge{border:1px solid #93c5fd!important;color:#1e3a8a!important;background:#eff6ff!important}.wrong-row{background:#fee2e2!important}.wrong-answer{color:#991b1b!important}}\n</style>`);

    html=html.replace(/<section id="startScreen" class="screen active">[\s\S]*?<\/section>\n<section id="quizScreen"/,`<section id="startScreen" class="screen active"><h2>Choose a Week</h2><p class="subtitle">Tap a week to start. Core Words and Challenge Words will be mixed in a random order.</p><div id="weekGrid" class="week-grid"></div></section>\n<section id="quizScreen"`);

    html=html.replace('<button id="submitBtn" type="submit">Submit</button><button id="nextBtn" type="button" class="success" style="display:none">Next Word</button>','<button id="submitBtn" type="submit">Submit</button><button id="skipReadBtn" type="button" class="secondary" style="display:none">Skip Reading</button><button id="nextBtn" type="button" class="success" style="display:none" disabled>Next Word</button>');

    html=html.replace('<div id="feedbackBox" class="feedback"><p id="feedbackTitle" class="feedback-title"></p><span id="correctWord" class="chip"></span><div class="grid">','<div id="feedbackBox" class="feedback"><p id="feedbackTitle" class="feedback-title"></p><span id="correctWord" class="chip"></span><p id="readingStatus" class="reading-status" style="display:none">Reading the meaning and example...</p><div class="grid">');

    html=html.replace(/<section id="summaryScreen" class="screen">[\s\S]*?<\/section>\n<\/section><\/main>/,`<section id="summaryScreen" class="screen"><h2>Quiz Summary</h2><p class="subtitle">Review your answers below.</p><div class="score"><p class="score-num" id="scoreText">Score: 0 / 0 (0%)</p><p class="score-note" id="scoreNote">Great practice!</p><p class="summary-meta" id="resultDate"></p></div><p class="print-note">You can save this result by taking a screenshot, or use Print / Save as PDF.</p><div class="table-wrap"><table><thead><tr><th>The Word</th><th>Category</th><th>Your Answer</th><th>Result</th></tr></thead><tbody id="summaryTableBody"></tbody></table></div><div class="button-row no-print"><button id="printBtn" type="button">Print / Save as PDF</button><button id="homeBtn" type="button" class="secondary">Back to Home</button></div></section>\n</section></main>`);

    html=html.replace('const $=id=>document.getElementById(id);const startScreen=$(\'startScreen\'),quizScreen=$(\'quizScreen\'),summaryScreen=$(\'summaryScreen\'),weekSelect=$(\'weekSelect\'),startBtn=$(\'startBtn\'),quizTitle=$(\'quizTitle\'),quizInstruction=$(\'quizInstruction\'),progressText=$(\'progressText\'),listenBtn=$(\'listenBtn\'),answerForm=$(\'answerForm\'),answerInput=$(\'answerInput\'),submitBtn=$(\'submitBtn\'),nextBtn=$(\'nextBtn\'),feedbackBox=$(\'feedbackBox\'),feedbackTitle=$(\'feedbackTitle\'),correctWord=$(\'correctWord\'),preAnswerDefs=$(\'preAnswerDefs\'),enDefs=$(\'enDefs\'),enEx=$(\'enEx\'),zhDef=$(\'zhDef\'),scoreText=$(\'scoreText\'),scoreNote=$(\'scoreNote\'),summaryTableBody=$(\'summaryTableBody\'),homeBtn=$(\'homeBtn\');',`const $=id=>document.getElementById(id);const startScreen=$('startScreen'),quizScreen=$('quizScreen'),summaryScreen=$('summaryScreen'),weekGrid=$('weekGrid'),quizTitle=$('quizTitle'),quizInstruction=$('quizInstruction'),progressText=$('progressText'),listenBtn=$('listenBtn'),answerForm=$('answerForm'),answerInput=$('answerInput'),submitBtn=$('submitBtn'),skipReadBtn=$('skipReadBtn'),nextBtn=$('nextBtn'),feedbackBox=$('feedbackBox'),feedbackTitle=$('feedbackTitle'),correctWord=$('correctWord'),readingStatus=$('readingStatus'),preAnswerDefs=$('preAnswerDefs'),enDefs=$('enDefs'),enEx=$('enEx'),zhDef=$('zhDef'),scoreText=$('scoreText'),scoreNote=$('scoreNote'),resultDate=$('resultDate'),summaryTableBody=$('summaryTableBody'),printBtn=$('printBtn'),homeBtn=$('homeBtn');`);

    html=html.replace(/function initWeeks\(\)\{[\s\S]*?\}\nfunction show/,`function initWeeks(){weekGrid.innerHTML='';Object.keys(vocabularyData).forEach(k=>{const btn=document.createElement('button');btn.type='button';btn.className='week-btn';btn.innerHTML='<span>'+formatWeekLabel(k)+'</span><small>'+weekMeta[k]+'</small>';btn.addEventListener('click',()=>startQuiz(k));weekGrid.appendChild(btn)})}\nfunction show`);

    html=html.replace(/function bestVoice\(\)\{[\s\S]*?\}\nfunction speak/,`function bestVoice(){if(!window.speechSynthesis)return null;const voices=window.speechSynthesis.getVoices();if(!voices||!voices.length)return null;const preferred=['Google US English','Microsoft Aria','Microsoft Jenny','Microsoft Ava','Microsoft Guy','Samantha','Karen','Daniel','Serena'];for(const name of preferred){const v=voices.find(x=>x.name.toLowerCase().includes(name.toLowerCase())&&x.lang.toLowerCase().includes('en'));if(v)return v}return voices.find(v=>v.name.toLowerCase().includes('natural')&&v.lang.toLowerCase().includes('en-'))||voices.find(v=>v.name.toLowerCase().includes('google')&&v.lang.toLowerCase().includes('en-us'))||voices.find(v=>v.lang==='en-US'||v.lang==='en-GB')||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('en'))||null}\nfunction speak`);

    html=html.replace(/function speak\(word\)\{[\s\S]*?\}\nfunction resetAnswer\(\)\{[\s\S]*?\}\nfunction addDefs/,`function speak(word){speakText(word,{rate:.8})}\nfunction speakText(text,{rate=.84,onend=null}={}){if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){if(onend)onend();return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=rate;u.pitch=1;u.volume=1;const v=bestVoice();if(v){u.voice=v;u.lang=v.lang||'en-US'}else{u.lang='en-US'}let done=false;u.onend=()=>{if(done)return;done=true;if(onend)onend()};u.onerror=()=>{if(done)return;done=true;if(onend)onend()};window.speechSynthesis.speak(u)}\nfunction buildReadingText(item){const meaning=item.en_defs&&item.en_defs.length?item.en_defs[0]:'';return 'The word is '+item.word+'. '+item.word+' means: '+meaning+'. Example: '+item.en_ex}\nfunction finishReading(){if(readingStatus)readingStatus.style.display='none';if(skipReadBtn)skipReadBtn.style.display='none';nextBtn.disabled=false;nextBtn.focus()}\nfunction readAfterAnswer(item){nextBtn.disabled=true;if(skipReadBtn)skipReadBtn.style.display='inline-flex';if(readingStatus)readingStatus.style.display='block';speakText(buildReadingText(item),{rate:.82,onend:finishReading})}\nfunction skipReading(){if(window.speechSynthesis)window.speechSynthesis.cancel();finishReading()}\nfunction resetAnswer(){answerInput.value='';answerInput.disabled=false;submitBtn.disabled=false;if(skipReadBtn)skipReadBtn.style.display='none';nextBtn.style.display='none';nextBtn.disabled=true;if(readingStatus)readingStatus.style.display='none';feedbackBox.className='feedback';feedbackTitle.textContent='';correctWord.textContent='';preAnswerDefs.innerHTML='';enDefs.innerHTML='';enEx.textContent='';zhDef.textContent=''}\nfunction addDefs`);

    html=html.replace(/function startQuiz\(\)\{[\s\S]*?\}\nfunction normalize/,`function startQuiz(weekKey){selectedWeekKey=weekKey;currentWords=shuffle(vocabularyData[selectedWeekKey]||[]);currentIndex=0;score=0;results=[];if(!currentWords.length){alert('No words found for this week.');return}show(quizScreen);renderWord()}\nfunction normalize`);

    html=html.replace(/function submitAnswer\(e\)\{[\s\S]*?\}\nfunction nextWord/,`function submitAnswer(e){e.preventDefault();if(answerInput.disabled)return;const item=currentWords[currentIndex];const userAnswer=answerInput.value.trim();const isCorrect=normalize(userAnswer)===normalize(item.word);if(isCorrect)score++;results.push({word:item.word,category:item.category,userAnswer,isCorrect});answerInput.disabled=true;submitBtn.disabled=true;nextBtn.style.display='inline-flex';nextBtn.disabled=true;feedbackBox.className='feedback visible '+(isCorrect?'correct':'wrong');feedbackTitle.textContent=isCorrect?'Correct!':'Try Again Next Time';correctWord.textContent=item.category+' Word — Correct spelling: '+item.word;addDefs(enDefs,item.en_defs);enEx.textContent=item.en_ex;zhDef.textContent=item.zh_def;readAfterAnswer(item)}\nfunction nextWord`);

    html=html.replace(/function renderSummary\(\)\{[\s\S]*?\}\nif\(window\.speechSynthesis\)/,`function renderSummary(){const total=currentWords.length;const percent=total?Math.round(score/total*100):0;const now=new Date();scoreText.textContent='Score: '+score+' / '+total+' ('+percent+'%)';scoreNote.textContent=percent===100?'Perfect work!':percent>=80?'Great job!':percent>=60?'Good practice. Keep going!':'Keep practicing. You can improve!';if(resultDate)resultDate.textContent='Completed: '+now.toLocaleString('en-US',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});summaryTableBody.innerHTML='';results.forEach(r=>{const tr=document.createElement('tr');if(!r.isCorrect)tr.classList.add('wrong-row');const w=document.createElement('td');w.textContent=r.word;const c=document.createElement('td');const b=document.createElement('span');b.className='badge';b.textContent=r.category;c.appendChild(b);const a=document.createElement('td');a.textContent=r.userAnswer||'No answer';if(!r.isCorrect)a.classList.add('wrong-answer');const res=document.createElement('td');res.className='result';res.textContent=r.isCorrect?'✔️':'❌';tr.append(w,c,a,res);summaryTableBody.appendChild(tr)})}\nif(window.speechSynthesis)`);

    html=html.replace("initWeeks();startBtn.addEventListener('click',startQuiz);listenBtn.addEventListener('click',()=>{const item=currentWords[currentIndex];if(item){speak(item.word);if(!answerInput.disabled)answerInput.focus()}});answerForm.addEventListener('submit',submitAnswer);nextBtn.addEventListener('click',nextWord);homeBtn.addEventListener('click',()=>location.reload());",`initWeeks();listenBtn.addEventListener('click',()=>{const item=currentWords[currentIndex];if(item){speak(item.word);if(!answerInput.disabled)answerInput.focus()}});answerForm.addEventListener('submit',submitAnswer);if(skipReadBtn)skipReadBtn.addEventListener('click',skipReading);nextBtn.addEventListener('click',nextWord);if(printBtn)printBtn.addEventListener('click',()=>window.print());homeBtn.addEventListener('click',()=>location.reload());`);

    document.open();
    document.write(html);
    document.close();
  })
  .catch(error=>{
    document.getElementById('loader').innerHTML='<h1>Unable to load quiz</h1><div class="err">'+String(error.message||error)+'</div><p>Please reload the page or open it in Chrome / Safari.</p>';
  });
</script>
</body>
</html>
